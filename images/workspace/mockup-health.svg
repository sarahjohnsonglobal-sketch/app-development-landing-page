<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041226"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#082b3d"/>
    </linearGradient>
    <linearGradient id="doctorTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d213a"/>
    </linearGradient>
    <filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="20" fill="url(#hBgGrad)"/>
  <circle cx="500" cy="80" r="120" fill="#0ea5e9" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="100" cy="300" r="140" fill="#06b6d4" fill-opacity="0.12" filter="blur(50px)"/>

  <!-- Phone Mockup Container -->
  <g transform="translate(160, 20)" filter="url(#hShadow)">
    <rect width="280" height="320" rx="32" fill="#111827" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="6" y="6" width="268" height="308" rx="26" fill="#030b17"/>

    <!-- Dynamic Island Notch -->
    <rect x="95" y="12" width="90" height="18" rx="9" fill="#000000"/>
    <circle cx="170" cy="21" r="3.5" fill="#0369a1"/>

    <!-- Status Bar Icons -->
    <text x="32" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">9:41</text>
    <g transform="translate(225, 17)" fill="#94a3b8">
      <rect x="0" y="2" width="3" height="6" rx="0.5"/>
      <rect x="4" y="0" width="3" height="8" rx="0.5"/>
      <rect x="8" y="-2" width="3" height="10" rx="0.5"/>
      <rect x="14" y="0" width="14" height="8" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
      <rect x="16" y="2" width="8" height="4" rx="1" fill="#38bdf8"/>
    </g>

    <!-- Doctor Live Consultation Tile -->
    <g transform="translate(20, 42)">
      <rect width="240" height="110" rx="16" fill="url(#doctorTile)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <!-- Doctor Avatar Silhouette / Circle -->
      <circle cx="45" cy="55" r="28" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Doctor Icon graphic -->
      <path d="M45 42 A 8 8 0 1 0 45 58 A 8 8 0 1 0 45 42 Z M35 68 C35 61, 55 61, 55 68 Z" fill="#ffffff" fill-opacity="0.9"/>
      <!-- Stethoscope badge -->
      <circle cx="62" cy="68" r="8" fill="#10b981"/>
      <path d="M59 68 L61 70 L65 66" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Doctor Info -->
      <text x="86" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Dr. Sarah Chen, MD</text>
      <text x="86" y="58" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Chief Tele-Cardiologist</text>
      
      <!-- Live Video Tag -->
      <rect x="86" y="68" width="94" height="18" rx="9" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8"/>
      <circle cx="95" cy="77" r="3" fill="#10b981"/>
      <text x="103" y="81" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700">1080p WebRTC HD</text>
    </g>

    <!-- Real-Time ECG Waveform Box -->
    <g transform="translate(20, 162)">
      <rect width="240" height="48" rx="12" fill="#07182e" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">LIVE HEART RATE (ECG)</text>
      <text x="14" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800">72 <tspan font-size="10" font-weight="500" fill="#94a3b8">BPM</tspan></text>
      <!-- Heartbeat Line -->
      <path d="M110 30 L130 30 L136 20 L142 42 L148 14 L154 36 L160 30 L180 30 L186 22 L192 38 L198 30 L226 30" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Two Vital Metric Chips -->
    <g transform="translate(20, 218)">
      <rect width="115" height="42" rx="10" fill="#082038" stroke="#1e3a5f" stroke-width="0.8"/>
      <text x="12" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600">BLOOD OXYGEN</text>
      <text x="12" y="34" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">99% <tspan font-size="9" fill="#6ee7b7">SpO2</tspan></text>

      <g transform="translate(125, 0)">
        <rect width="115" height="42" rx="10" fill="#082038" stroke="#1e3a5f" stroke-width="0.8"/>
        <text x="12" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600">BLOOD PRESSURE</text>
        <text x="12" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">118/74</text>
      </g>
    </g>

    <!-- E-Prescription Transmitted Pill -->
    <g transform="translate(20, 270)">
      <rect width="240" height="28" rx="8" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.8"/>
      <circle cx="34" cy="14" r="5" fill="#38bdf8"/>
      <path d="M32 14 L33.5 15.5 L36.5 12.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <text x="46" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">e-Prescription &amp; HIPAA Verified</text>
    </g>
  </g>
</svg>
