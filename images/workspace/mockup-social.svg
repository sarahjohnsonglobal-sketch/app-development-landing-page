<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021414"/>
      <stop offset="50%" stop-color="#072023"/>
      <stop offset="100%" stop-color="#140628"/>
    </linearGradient>
    <filter id="sShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="20" fill="url(#sBgGrad)"/>
  <circle cx="500" cy="80" r="120" fill="#14b8a6" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="100" cy="300" r="140" fill="#ec4899" fill-opacity="0.12" filter="blur(50px)"/>

  <!-- Phone Mockup Container -->
  <g transform="translate(160, 20)" filter="url(#sShadow)">
    <rect width="280" height="320" rx="32" fill="#111827" stroke="#134e4a" stroke-width="3"/>
    <rect x="6" y="6" width="268" height="308" rx="26" fill="#040d12"/>

    <!-- Dynamic Island Notch -->
    <rect x="95" y="12" width="90" height="18" rx="9" fill="#000000"/>
    <circle cx="170" cy="21" r="3.5" fill="#14b8a6"/>

    <!-- Status Bar Icons -->
    <text x="32" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">9:41</text>
    <g transform="translate(225, 17)" fill="#94a3b8">
      <rect x="0" y="2" width="3" height="6" rx="0.5"/>
      <rect x="4" y="0" width="3" height="8" rx="0.5"/>
      <rect x="8" y="-2" width="3" height="10" rx="0.5"/>
      <rect x="14" y="0" width="14" height="8" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
      <rect x="16" y="2" width="8" height="4" rx="1" fill="#14b8a6"/>
    </g>

    <!-- Live Stream Video Broadcast View -->
    <g transform="translate(20, 42)">
      <rect width="240" height="130" rx="16" fill="#0f172a" stroke="#042f2e" stroke-width="1"/>
      
      <!-- Creator Studio Background gradient simulation -->
      <rect x="4" y="4" width="232" height="122" rx="12" fill="#0d1f2d"/>
      <circle cx="120" cy="60" r="35" fill="#0284c7" fill-opacity="0.3"/>
      <!-- Streamer silhouette -->
      <circle cx="120" cy="50" r="22" fill="#38bdf8"/>
      <path d="M96 90 C96 72, 144 72, 144 90 Z" fill="#0284c7"/>

      <!-- Live Broadcast Badge Top -->
      <rect x="14" y="12" width="70" height="20" rx="10" fill="#dc2626"/>
      <circle cx="24" cy="22" r="3.5" fill="#ffffff"/>
      <text x="32" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800">LIVE</text>
      <text x="56" y="26" fill="#fee2e2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600">14.8K</text>

      <!-- 60 FPS Badge -->
      <rect x="164" y="12" width="62" height="20" rx="10" fill="#000000" fill-opacity="0.7"/>
      <text x="174" y="25" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700">60 FPS HDR</text>

      <!-- Floating Hearts on the right -->
      <text x="205" y="75" font-size="14" fill="#ec4899">❤️</text>
      <text x="215" y="95" font-size="16" fill="#f43f5e">💖</text>
      <text x="195" y="115" font-size="13" fill="#14b8a6">🔥</text>
    </g>

    <!-- Live SuperChat Tip Card -->
    <g transform="translate(20, 180)">
      <rect width="240" height="42" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
      <text x="12" y="19" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700">⭐ SUPERCHAT TIP $50.00</text>
      <text x="12" y="33" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">@alex_dev: "Ultra fast 60fps streaming!"</text>
    </g>

    <!-- Chat Message Bubble -->
    <g transform="translate(20, 228)">
      <rect width="240" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="12" y="16" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700">@sarah_m: <tspan fill="#ffffff" font-weight="normal">Cloudflare Edge latency is under 30ms!</tspan></text>
      <text x="12" y="28" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8">Just now</text>
    </g>

    <!-- Bottom Tag -->
    <g transform="translate(20, 270)">
      <rect width="240" height="28" rx="8" fill="#0f766e" fill-opacity="0.3" stroke="#14b8a6" stroke-width="0.8"/>
      <circle cx="34" cy="14" r="5" fill="#14b8a6"/>
      <text x="46" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Ultra-Low Latency &amp; Native Media Engine</text>
    </g>
  </g>
</svg>
