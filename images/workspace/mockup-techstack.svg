<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#140b27"/>
    </linearGradient>
    <linearGradient id="tWindowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="tGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="680" height="480" rx="28" fill="url(#tBg)"/>
  <circle cx="580" cy="100" r="140" fill="#38bdf8" fill-opacity="0.12" filter="blur(50px)"/>
  <circle cx="100" cy="400" r="160" fill="#a855f7" fill-opacity="0.12" filter="blur(60px)"/>

  <!-- Code Editor & Engineering Cockpit Window -->
  <g transform="translate(30, 24)" filter="url(#tGlow)">
    <rect width="620" height="432" rx="20" fill="url(#tWindowGrad)" stroke="#334155" stroke-width="1.2"/>

    <!-- Mac Window Bar -->
    <rect width="620" height="42" rx="20" fill="#0f172a"/>
    <rect y="22" width="620" height="20" fill="#0f172a"/>
    <line x1="0" y1="42" x2="620" y2="42" stroke="#1e293b" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="28" cy="21" r="6" fill="#ef4444"/>
    <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="21" r="6" fill="#10b981"/>

    <text x="96" y="25" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600">AppEngine.tsx — Mobile Architecture</text>
    
    <rect x="500" y="11" width="102" height="20" rx="10" fill="#065f46" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="512" cy="21" r="3" fill="#34d399"/>
    <text x="522" y="25" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">BUILD: 200 OK</text>

    <!-- Code Block -->
    <g transform="translate(24, 60)" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" line-height="1.6">
      <text x="0" y="14" fill="#64748b">// 1. Algofort Production Mobile Engine</text>
      <text x="0" y="34">
        <tspan fill="#c084fc">import</tspan> <tspan fill="#f1f5f9">{</tspan> <tspan fill="#38bdf8">NativeEngine</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#38bdf8">CloudSync</tspan> <tspan fill="#f1f5f9">}</tspan> <tspan fill="#c084fc">from</tspan> <tspan fill="#34d399">'@algofort/core'</tspan><tspan fill="#f1f5f9">;</tspan>
      </text>

      <text x="0" y="60">
        <tspan fill="#c084fc">export const</tspan> <tspan fill="#fbbf24">productionApp</tspan> <tspan fill="#f1f5f9">= </tspan><tspan fill="#c084fc">new</tspan> <tspan fill="#38bdf8">NativeEngine</tspan><tspan fill="#f1f5f9">({</tspan>
      </text>

      <text x="24" y="80">
        <tspan fill="#94a3b8">platforms:</tspan> <tspan fill="#f1f5f9">[</tspan><tspan fill="#34d399">'iOS'</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#34d399">'Android'</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#34d399">'Web'</tspan><tspan fill="#f1f5f9">],</tspan>
      </text>

      <text x="24" y="100">
        <tspan fill="#94a3b8">stack:</tspan> <tspan fill="#f1f5f9">[</tspan><tspan fill="#34d399">'React Native'</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#34d399">'Flutter'</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#34d399">'Swift'</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#34d399">'Kotlin'</tspan><tspan fill="#f1f5f9">],</tspan>
      </text>

      <text x="24" y="120">
        <tspan fill="#94a3b8">backend:</tspan> <tspan fill="#f1f5f9">[</tspan><tspan fill="#34d399">'Node.js'</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#34d399">'Firebase'</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#34d399">'AWS Cloud'</tspan><tspan fill="#f1f5f9">],</tspan>
      </text>

      <text x="24" y="140">
        <tspan fill="#94a3b8">performance:</tspan> <tspan fill="#f1f5f9">{ </tspan><tspan fill="#94a3b8">fps:</tspan> <tspan fill="#f59e0b">60</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#94a3b8">coldStart:</tspan> <tspan fill="#34d399">'&lt;380ms'</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#94a3b8">sla:</tspan> <tspan fill="#34d399">'99.99%'</tspan> <tspan fill="#f1f5f9">}</tspan>
      </text>

      <text x="0" y="164" fill="#f1f5f9">});</text>
      
      <text x="0" y="190" fill="#38bdf8">// ✓ Live Worldwide • iOS App Store &amp; Google Play Certified</text>
    </g>

    <!-- Visual Tech Badges Grid (8 Official Frameworks with Real SVG Icons) -->
    <g transform="translate(24, 275)">
      
      <!-- React Native Badge -->
      <g transform="translate(0, 0)">
        <rect width="138" height="58" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
        <!-- React Atom SVG -->
        <g transform="translate(14, 15)">
          <ellipse cx="14" cy="14" rx="14" ry="5.5" stroke="#38bdf8" stroke-width="1.8" fill="none" transform="rotate(0 14 14)"/>
          <ellipse cx="14" cy="14" rx="14" ry="5.5" stroke="#38bdf8" stroke-width="1.8" fill="none" transform="rotate(60 14 14)"/>
          <ellipse cx="14" cy="14" rx="14" ry="5.5" stroke="#38bdf8" stroke-width="1.8" fill="none" transform="rotate(120 14 14)"/>
          <circle cx="14" cy="14" r="2.5" fill="#38bdf8"/>
        </g>
        <text x="50" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">React Native</text>
        <text x="50" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">Cross-Platform</text>
      </g>

      <!-- Flutter Badge -->
      <g transform="translate(148, 0)">
        <rect width="138" height="58" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
        <!-- Flutter Wings SVG -->
        <g transform="translate(14, 15)">
          <polygon points="17,2 2,17 7,22 22,7" fill="#0284c7"/>
          <polygon points="22,17 14,25 19,30 27,22" fill="#38bdf8"/>
          <polygon points="12,19 7,24 14,31 19,31" fill="#0369a1"/>
        </g>
        <text x="50" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Flutter</text>
        <text x="50" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">High-FPS UI</text>
      </g>

      <!-- Swift (iOS) Badge -->
      <g transform="translate(296, 0)">
        <rect width="138" height="58" rx="12" fill="#0f172a" stroke="#ea580c" stroke-width="1.2"/>
        <!-- Swift Bird SVG -->
        <g transform="translate(14, 15)">
          <path d="M26,16 C21,21 13,23 5,19 C11,25 21,26 27,21 C21,27 10,27 3,24 C14,30 26,27 30,17 C30,12 28,6 26,2 C23,8 18,13 14,14 C19,10 22,5 24,1 C16,7 9,16 6,24 C15,22 23,17 26,16 Z" fill="#f97316"/>
        </g>
        <text x="50" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Swift (iOS)</text>
        <text x="50" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">Apple Native</text>
      </g>

      <!-- Kotlin (Android) Badge -->
      <g transform="translate(444, 0)">
        <rect width="138" height="58" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
        <!-- Kotlin Flag SVG -->
        <g transform="translate(14, 15)">
          <polygon points="2,2 26,2 14,14" fill="#a855f7"/>
          <polygon points="2,26 26,2 14,14 2,2" fill="#7c3aed"/>
          <polygon points="2,26 14,14 26,26" fill="#f97316"/>
        </g>
        <text x="50" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Kotlin (Android)</text>
        <text x="50" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">Google Native</text>
      </g>

      <!-- Second Row of Badges -->
      <!-- Node.js Badge -->
      <g transform="translate(0, 68)">
        <rect width="138" height="58" rx="12" fill="#0f172a" stroke="#16a34a" stroke-width="1.2"/>
        <g transform="translate(14, 15)">
          <polygon points="14,2 26,9 26,23 14,30 2,23 2,9" fill="#16a34a" stroke="#22c55e" stroke-width="1.5"/>
        </g>
        <text x="50" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Node.js</text>
        <text x="50" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">Scalable Engine</text>
      </g>

      <!-- Firebase Badge -->
      <g transform="translate(148, 68)">
        <rect width="138" height="58" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
        <g transform="translate(14, 15)">
          <path d="M4,24 L14,4 L18,12 L24,2 L26,24 Z" fill="#f59e0b"/>
          <path d="M4,24 L14,4 L18,12 L14,24 Z" fill="#d97706"/>
          <path d="M14,24 L18,12 L26,24 Z" fill="#b45309"/>
        </g>
        <text x="50" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Firebase</text>
        <text x="50" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">Realtime Sync</text>
      </g>

      <!-- AWS Cloud Badge -->
      <g transform="translate(296, 68)">
        <rect width="138" height="58" rx="12" fill="#0f172a" stroke="#f97316" stroke-width="1.2"/>
        <g transform="translate(14, 15)">
          <rect x="4" y="6" width="20" height="16" rx="4" fill="#ea580c"/>
          <path d="M4,24 Q14,29 24,24" stroke="#f97316" stroke-width="2" fill="none"/>
        </g>
        <text x="50" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">AWS Cloud</text>
        <text x="50" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">Microservices</text>
      </g>

      <!-- Python / AI Badge -->
      <g transform="translate(444, 68)">
        <rect width="138" height="58" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
        <g transform="translate(14, 15)">
          <path d="M14,2 C8,2 8,5 8,7 L8,11 L14,11 L14,13 L5,13 C3,13 2,15 2,18 C2,22 4,24 7,24 L9,24 L9,21 C9,19 11,17 14,17 L18,17 C20,17 21,15 21,13 L21,7 C21,4 18,2 14,2 Z" fill="#3b82f6"/>
          <path d="M14,26 C20,26 20,23 20,21 L20,17 L14,17 L14,15 L23,15 C25,15 26,13 26,10 C26,6 24,4 21,4 L19,4 L19,7 C19,9 17,11 14,11 L10,11 C8,11 7,13 7,15 L7,21 C7,24 10,26 14,26 Z" fill="#facc15"/>
        </g>
        <text x="50" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Python &amp; AI</text>
        <text x="50" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">Backend Core</text>
      </g>

    </g>
  </g>
</svg>
