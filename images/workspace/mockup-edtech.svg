<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="eBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150824"/>
      <stop offset="50%" stop-color="#210d38"/>
      <stop offset="100%" stop-color="#2a0827"/>
    </linearGradient>
    <filter id="eShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="20" fill="url(#eBgGrad)"/>
  <circle cx="500" cy="80" r="120" fill="#f43f5e" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="100" cy="300" r="140" fill="#a855f7" fill-opacity="0.12" filter="blur(50px)"/>

  <!-- Phone Mockup Container -->
  <g transform="translate(160, 20)" filter="url(#eShadow)">
    <rect width="280" height="320" rx="32" fill="#18181b" stroke="#4c1d95" stroke-width="3"/>
    <rect x="6" y="6" width="268" height="308" rx="26" fill="#090514"/>

    <!-- Dynamic Island Notch -->
    <rect x="95" y="12" width="90" height="18" rx="9" fill="#000000"/>
    <circle cx="170" cy="21" r="3.5" fill="#f43f5e"/>

    <!-- Status Bar Icons -->
    <text x="32" y="25" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">9:41</text>
    <g transform="translate(225, 17)" fill="#a1a1aa">
      <rect x="0" y="2" width="3" height="6" rx="0.5"/>
      <rect x="4" y="0" width="3" height="8" rx="0.5"/>
      <rect x="8" y="-2" width="3" height="10" rx="0.5"/>
      <rect x="14" y="0" width="14" height="8" rx="2" fill="none" stroke="#a1a1aa" stroke-width="1.2"/>
      <rect x="16" y="2" width="8" height="4" rx="1" fill="#f43f5e"/>
    </g>

    <!-- Course Banner &amp; Progress Ring -->
    <g transform="translate(20, 42)">
      <rect width="240" height="95" rx="16" fill="#1e1035" stroke="#3b0764" stroke-width="1"/>
      
      <!-- Course Title -->
      <text x="16" y="26" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">ACTIVE MASTERCLASS</text>
      <text x="16" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">Full-Stack Mobile App</text>
      <text x="16" y="58" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">React Native &amp; Flutter</text>

      <!-- Progress Bar -->
      <rect x="16" y="70" width="140" height="6" rx="3" fill="#3b0764"/>
      <rect x="16" y="70" width="118" height="6" rx="3" fill="#f43f5e"/>
      <text x="16" y="86" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700">84% Complete</text>

      <!-- Circular Badge right -->
      <circle cx="198" cy="48" r="26" fill="#2e1065" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="187" y="52" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">⭐</text>
    </g>

    <!-- Interactive Lesson Module Card -->
    <g transform="translate(20, 146)">
      <rect width="240" height="60" rx="12" fill="#180e2b" stroke="#2e1065" stroke-width="0.8"/>
      <circle cx="34" cy="30" r="14" fill="#831843"/>
      <text x="27" y="34" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold">&lt;&gt;</text>
      
      <text x="56" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Lesson 08: State &amp; Hooks</text>
      <text x="56" y="40" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">Quiz Passed • +50 XP Earned</text>

      <rect x="186" y="20" width="42" height="20" rx="6" fill="#065f46"/>
      <text x="194" y="34" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700">✓ Done</text>
    </g>

    <!-- Gamified Streaks Row -->
    <g transform="translate(20, 214)">
      <rect width="115" height="46" rx="10" fill="#180e2b" stroke="#2e1065" stroke-width="0.8"/>
      <text x="12" y="20" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600">DEV STREAK</text>
      <text x="12" y="38" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">🔥 24 Days</text>

      <g transform="translate(125, 0)">
        <rect width="115" height="46" rx="10" fill="#180e2b" stroke="#2e1065" stroke-width="0.8"/>
        <text x="12" y="20" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600">TOTAL SCORE</text>
        <text x="12" y="38" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">1,420 XP</text>
      </g>
    </g>

    <!-- Bottom Tag -->
    <g transform="translate(20, 270)">
      <rect width="240" height="28" rx="8" fill="#831843" fill-opacity="0.3" stroke="#f43f5e" stroke-width="0.8"/>
      <circle cx="34" cy="14" r="5" fill="#f43f5e"/>
      <text x="46" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Offline Downloads &amp; AI Micro-Learning</text>
    </g>
  </g>
</svg>
