<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#061c16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="20" fill="url(#bgGrad)"/>
  <circle cx="500" cy="80" r="120" fill="#10b981" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="100" cy="300" r="140" fill="#047857" fill-opacity="0.15" filter="blur(50px)"/>

  <!-- Phone Mockup Container -->
  <g transform="translate(160, 20)" filter="url(#shadow)">
    <!-- Phone Bezel -->
    <rect width="280" height="320" rx="32" fill="#111827" stroke="#374151" stroke-width="3"/>
    <rect x="6" y="6" width="268" height="308" rx="26" fill="#030712"/>

    <!-- Dynamic Island Notch -->
    <rect x="95" y="12" width="90" height="18" rx="9" fill="#000000"/>
    <circle cx="170" cy="21" r="3.5" fill="#1e293b"/>

    <!-- Status Bar Icons -->
    <text x="32" y="25" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">9:41</text>
    <g transform="translate(225, 17)" fill="#9ca3af">
      <rect x="0" y="2" width="3" height="6" rx="0.5"/>
      <rect x="4" y="0" width="3" height="8" rx="0.5"/>
      <rect x="8" y="-2" width="3" height="10" rx="0.5"/>
      <rect x="14" y="0" width="14" height="8" rx="2" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
      <rect x="16" y="2" width="8" height="4" rx="1" fill="#34d399"/>
    </g>

    <!-- App Header -->
    <text x="24" y="54" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">Total Balance</text>
    <text x="24" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700">$48,250.00</text>
    <rect x="180" y="62" width="68" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
    <text x="190" y="76" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">+14.2% ↑</text>

    <!-- Credit Card Preview -->
    <g transform="translate(20, 92)" filter="url(#shadow)">
      <rect width="240" height="110" rx="16" fill="url(#cardGrad)" stroke="#6ee7b7" stroke-width="0.8" stroke-opacity="0.4"/>
      <!-- EMV Chip -->
      <rect x="18" y="16" width="28" height="20" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="0.8"/>
      <line x1="18" y1="26" x2="46" y2="26" stroke="#b45309" stroke-width="0.6"/>
      <!-- Contactless icon -->
      <path d="M56 22 A 6 6 0 0 1 56 30 M60 18 A 11 11 0 0 1 60 34" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8"/>
      <!-- Card Brand -->
      <text x="175" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PayPulse</text>
      <!-- Card Number -->
      <text x="18" y="68" fill="#ecfdf5" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="600" letter-spacing="2">••••  ••••  4829</text>
      <!-- Card Holder &amp; Expiry -->
      <text x="18" y="94" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="500">ALEX MORGAN</text>
      <text x="185" y="94" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="500">12/28</text>
    </g>

    <!-- Spending Trend Sparkline -->
    <g transform="translate(20, 218)">
      <rect width="240" height="42" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="14" y="19" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="500">Weekly Activity</text>
      <text x="14" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">+$3,450.00</text>
      <!-- Mini Chart Path -->
      <path d="M120 28 Q140 12, 160 22 T200 14 T230 18" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Bottom Action Pill -->
    <g transform="translate(20, 272)">
      <rect width="240" height="28" rx="8" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="0.8"/>
      <circle cx="34" cy="14" r="5" fill="#10b981"/>
      <text x="46" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Verified Stripe &amp; Apple Pay Engine</text>
    </g>
  </g>
</svg>
